name: tests

on:
  push:
    branches: [main, dev, qa]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # Fail the build if any test module fails to even import/collect. This is
      # what previously let stale tests (referencing removed symbols) rot
      # silently — a collection error is a real failure, not a skip.
      - name: Check test collection (no import/collection errors)
        run: pytest --collect-only -q

      - name: Run tests
        run: pytest -q
